name: Feature idea
description: Something Echo One should do. Bigger ideas can start in Discussions.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should Echo One do, and when would you use it?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
  - type: dropdown
    id: feature
    attributes:
      label: Which part?
      options:
        - Dictation
        - Meetings
        - Voice Agent
        - Echo Actions
        - Something new
